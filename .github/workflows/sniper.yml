name: Vibhu Price Sniper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

# Prevent multiple scanner runs from running at the same time.
# If one scan is still running, the next scheduled run waits.
concurrency:
  group: vibhu-price-sniper
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sniper.py

      - name: Save state
        if: always()
        run: |
          git config user.name "vibhu-price-sniper"
          git config user.email "actions@users.noreply.github.com"

          git add state.json

          git diff --cached --quiet || git commit -m "Update scanner state"

          git push || true